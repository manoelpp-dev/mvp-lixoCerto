spring.application.name=mvpbackend

spring.datasource.url=jdbc:postgresql://localhost:5433/lixocerto
spring.datasource.username=lixocerto
spring.datasource.password=lixocerto

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave do Gemini: vem da variavel de ambiente GEMINI_API_KEY

gemini.api.key=${GEMINI_API_KEY:}
spring.config.import=optional:file:.env[.properties]

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
server.error.include-message=always
app.seed.enabled=true
